<ng-template #content let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-stats">Statistiche</h4>
        <div class="btn-group ms-3" role="group" aria-label="Periodo">
            <button type="button" class="btn" [class.btn-dark]="scope === 'set'" [class.btn-outline-dark]="scope !== 'set'" (click)="setScope('set')">{{ setLabel }}</button>
            <button type="button" class="btn" [class.btn-dark]="scope === 'match'" [class.btn-outline-dark]="scope !== 'match'" (click)="setScope('match')">Partita</button>
        </div>
        <button type="button" class="btn btn-outline-primary ms-2" (click)="load()">Aggiorna</button>
        <button type="button" class="btn-close" aria-label="Chiudi" (click)="modal.close()"></button>
    </div>

    <div class="modal-body">
        @if (loading) {
            <div class="text-muted">Caricamento…</div>
        } @else if (error) {
            <div class="alert alert-danger mb-0">{{ error }}</div>
        } @else {
            <app-kpi-view [rows]="rows" [rallies]="rallies"></app-kpi-view>
        }
    </div>
</ng-template>
