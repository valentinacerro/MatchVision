<header class="app-header d-flex justify-content-between align-items-center">

    <h1 class="app-title" [routerLink]="['/']">MatchVision</h1>

    @if (auth.user(); as user) {
        <span class="account" [title]="user.email">{{ user.name || user.email }}</span>
        <button type="button" class="logout-btn" title="Esci" (click)="logout()">
            <img src="/icons/logout-icon.png" alt="Esci">
        </button>
    }

</header>
