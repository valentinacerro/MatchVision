<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <h2 class="h4 mb-4">Accedi</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- email -->
        <div class="mb-3">
          <label for="inputEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="inputEmail" formControlName="email" autocomplete="username"
            [class.is-invalid]="invalid('email')">
          <div class="invalid-feedback">Inserisci un'email valida</div>
        </div>
        <!-- password -->
        <div class="mb-3">
          <label for="inputPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="inputPassword" formControlName="password" autocomplete="current-password"
            [class.is-invalid]="invalid('password')">
          <div class="invalid-feedback">Inserisci la password</div>
        </div>
        @if (errors().length > 0) {
          <div class="alert alert-danger py-2" role="alert">
            @for (message of errors(); track message) { <div>{{ message }}</div> }
          </div>
        }
        <div class="d-flex justify-content-between align-items-center gap-3">
          <button type="submit" class="btn btn-primary" [disabled]="sending()">{{ sending() ? 'Accesso…' : 'Accedi' }}</button>
          <a [routerLink]="['/register']" queryParamsHandling="preserve" class="text-decoration-none">Non hai un account? Registrati</a>
        </div>
      </form>
    </div>
  </div>
</div>
